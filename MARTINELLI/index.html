<style>

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15181a;--fg:#e9ebe8;--mu:#98a09c;--ln:#32383a;--ac:#4cc2a5;--cd:#1e2325;--ok:#5fd37c;--ko:#ff8a80}}

<body><header><nav id="nav"></nav></header><main id="app"></main><section id="doc"></section><script src="../sync-config.js"></script><script>
/* ===== Cloud cifrato (Supabase) + funzioni per le app native ===== */
window.NATIVE=window.NATIVE||((window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?'android':'');
const clLS='cs1',clK=clLS+'sync',clBK=clLS+'bak',clApp='azienda',clCfg0=window.SYNC_CFG||{};
let clSt=Object.assign({url:'',key:'',email:'',pass:'',at:'',rt:'',exp:0,uid:'',rev:0,dirty:false,last:''},(()=>{try{return JSON.parse(localStorage.getItem(clK)||'{}')}catch(x){return{}}})());
const clUrl=()=>(clSt.url||clCfg0.url||'').trim().replace(/\/+$/,''),clKey0=()=>(clSt.key||clCfg0.key||'').trim();
const clSave=()=>{try{localStorage.setItem(clK,JSON.stringify(clSt))}catch(x){}};
const clOn=()=>!!(clSt.rt&&clSt.pass&&clUrl()&&clKey0());
const clHM=()=>new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'});
let clN=0,clBusy=false,clTm=null,clErr='',clOff=false,clAsking=false,clTyped=false,clDefer=false,clPickRes=null,clSalt=null,clTP=null,clSnooze=0;
const clHas=()=>{try{return window.__CLS0!==undefined&&JSON.stringify(S)!==window.__CLS0}catch(x){return true}};

/* ---- cifratura: PBKDF2 + AES-GCM, compressione gzip quando disponibile ---- */
const clB64=u=>{u=new Uint8Array(u);let s='';for(let i=0;i<u.length;i+=0x8000)s+=String.fromCharCode.apply(null,u.subarray(i,i+0x8000));return btoa(s)};
const clUn=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const clKeys={};
async function clKey(pass,sb){const id=pass+'|'+sb;if(!clKeys[id]){const m=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);clKeys[id]=await crypto.subtle.deriveKey({name:'PBKDF2',salt:clUn(sb),iterations:250000,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}return clKeys[id]}
async function clEnc(obj){if(!(window.crypto&&crypto.subtle))throw new Error('Cifratura non disponibile in questo browser');
 const raw=new TextEncoder().encode(JSON.stringify(obj));let z=0,data=raw;
 if(typeof CompressionStream!=='undefined'){try{data=new Uint8Array(await new Response(new Blob([raw]).stream().pipeThrough(new CompressionStream('gzip'))).arrayBuffer());z=1}catch(x){data=raw;z=0}}
 if(!clSalt)clSalt=clB64(crypto.getRandomValues(new Uint8Array(16)));
 const k=await clKey(clSt.pass,clSalt),iv=crypto.getRandomValues(new Uint8Array(12)),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,data);
 return JSON.stringify({v:1,z,s:clSalt,i:clB64(iv),c:clB64(ct)})}
async function clDec(txt){const o=JSON.parse(txt),k=await clKey(clSt.pass,o.s);let d;
 try{d=new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:clUn(o.i)},k,clUn(o.c)))}catch(x){throw new Error('PASS')}
 if(o.z)d=new Uint8Array(await new Response(new Blob([d]).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer());
 return JSON.parse(new TextDecoder().decode(d))}

/* ---- accesso e richieste a Supabase ---- */
const clSess=j=>{clSt.at=j.access_token;clSt.rt=j.refresh_token;clSt.exp=Date.now()+Math.max(30,(j.expires_in||3600)-60)*1000;if(j.user)clSt.uid=j.user.id;clSave()};
function clTok(){if(Date.now()<clSt.exp&&clSt.at)return Promise.resolve();if(clTP)return clTP;
 clTP=(async()=>{try{const r=await fetch(clUrl()+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:clKey0(),'Content-Type':'application/json'},body:JSON.stringify({refresh_token:clSt.rt})});
  const j=await r.json().catch(()=>({}));
  if(!r.ok){if(r.status>=400&&r.status<500){clSt.rt='';clSt.at='';clSave();throw new Error('Accesso scaduto: rientra dalle Impostazioni')}throw new TypeError('rete')}
  clSess(j)}finally{clTP=null}})();return clTP}
async function clReq(method,path,body,extra,retry){await clTok();
 const r=await fetch(clUrl()+path,{method,headers:Object.assign({apikey:clKey0(),Authorization:'Bearer '+clSt.at,'Content-Type':'application/json'},extra||{}),body:body==null?undefined:JSON.stringify(body)});
 if(r.status===401&&!retry){clSt.exp=0;return clReq(method,path,body,extra,1)}return r}
async function clEm(r){let j={};try{j=await r.json()}catch(x){}const m=j.message||j.error_description||j.msg||j.hint||('Errore '+r.status);
 return /does not exist|schema cache|Could not find the table/i.test(m)?'Tabella mancante su Supabase: esegui lo script SQL di preparazione':m}
async function clGet(){const r=await clReq('GET','/rest/v1/app_data?app=eq.'+clApp+'&select=payload,rev,updated_at,device');if(!r.ok)throw new Error(await clEm(r));const a=await r.json();return a[0]||null}
const clDev=()=>(window.NATIVE||'web')+' '+(navigator.platform||'');

/* ---- scrittura sul cloud con controllo di versione ---- */
async function clPush(){const n0=clN,body=await clEnc(S);let r,a;
 if(clSt.rev===0){r=await clReq('POST','/rest/v1/app_data',{app:clApp,payload:body,rev:1,device:clDev()},{Prefer:'return=representation'});
  if(r.status===409)return'conflict';if(!r.ok)throw new Error(await clEm(r));a=await r.json();clSt.rev=a[0].rev}
 else{r=await clReq('PATCH','/rest/v1/app_data?app=eq.'+clApp+'&rev=eq.'+clSt.rev,{payload:body,rev:clSt.rev+1,device:clDev(),updated_at:new Date().toISOString()},{Prefer:'return=representation'});
  if(!r.ok)throw new Error(await clEm(r));a=await r.json();if(!a.length)return'conflict';clSt.rev=a[0].rev}
 if(clN===n0)clSt.dirty=false;clSt.last=clHM();clSave();return'ok'}

/* ---- sincronizzazione ---- */
const clTyping=()=>{const a=document.activeElement;return clTyped||!!(a&&/^(INPUT|SELECT|TEXTAREA)$/.test(a.tagName)&&a.type!=='button'&&a.type!=='checkbox'&&a.closest&&a.closest('#app'))};
async function clSync(man,n){if(!clOn()||clBusy||clAsking)return;clBusy=true;clErr='';clOff=false;clUpd();
 try{const R=await clGet();
  if(!R){if(clSt.rev>0)clSt.rev=0;if(clHas()||clSt.dirty||man){if(await clPush()==='conflict'&&(n||0)<3){clBusy=false;return clSync(man,(n||0)+1)}}}
  else if(R.rev===clSt.rev){if(clSt.dirty&&await clPush()==='conflict'&&(n||0)<3){clBusy=false;return clSync(man,(n||0)+1)}}
  else if(R.rev>clSt.rev&&!clSt.dirty&&(clSt.rev>0||!clHas())){if(clTyping()){clDefer=true}else await clApply(R)}
  else if(man||Date.now()>=clSnooze)await clAsk(R)}
 catch(x){clFail(x)}
 clBusy=false;clUpd();if(man&&!clErr&&!clOff)toast('Sincronizzazione completata')}
function clFail(x){const m=String(x&&x.message||x);if(x instanceof TypeError||/Failed to fetch|NetworkError|Load failed|rete/i.test(m)){clOff=true;return}
 if(m==='PASS')clErr='passphrase di cifratura diversa da quella usata sugli altri dispositivi';else clErr=m;
 if(/Accesso scaduto/.test(m))setTimeout(draw,0)}
function clMark(){if(!clOn())return;clN++;clSt.dirty=true;clSave();clUpd();clearTimeout(clTm);clTm=setTimeout(()=>clSync(),1500)}
async function clApply(R){const d=await clDec(R.payload);S=norm(d);try{localStorage.setItem(clLS,JSON.stringify(S))}catch(x){}
 clSt.rev=R.rev;clSt.dirty=false;clSt.last=clHM();clSave();draw();toast('Dati aggiornati dal cloud')}
function clBak(){if(!clHas())return;try{localStorage.setItem(clBK,JSON.stringify({t:Date.now(),d:JSON.stringify(S)}))}catch(x){}}
const clBakHas=()=>{try{return!!localStorage.getItem(clBK)}catch(x){return false}};
function clRestoreBak(){let b;try{b=JSON.parse(localStorage.getItem(clBK))}catch(x){}if(!b)return alert('Nessuna copia di sicurezza');
 if(!confirm('Ripristinare la copia di sicurezza del '+new Date(b.t).toLocaleString('it-IT')+'? Sostituisce i dati attuali di questo dispositivo (e, alla sincronizzazione, quelli nel cloud).'))return;
 S=norm(JSON.parse(b.d));save();draw();toast('Copia di sicurezza ripristinata')}

/* ---- finestre di dialogo ---- */
function clModal(h){clModalX();const d=document.createElement('div');d.id='clm';d.className='np';d.style.cssText='position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(0,0,0,.55);z-index:100;display:flex;align-items:center;justify-content:center;padding:16px';
 d.innerHTML='<div style="background:var(--bg);color:var(--fg);border-radius:10px;max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:16px">'+h+'</div>';document.body.appendChild(d)}
const clModalX=()=>{const d=document.getElementById('clm');if(d)d.remove()};
function clAsk(R){clAsking=true;clUpd();return new Promise(res=>{
 clPickRes=async k=>{clModalX();clAsking=false;clBusy=true;
  try{if(k==='cloud'){clBak();await clApply(R)}
   else if(k==='later'){clSnooze=Date.now()+600000}
   else if(k==='local'){clSt.rev=R.rev;clSt.dirty=true;if(await clPush()==='conflict'){clBusy=false;clUpd();return clSync(true).then(res)}toast('Il cloud ora contiene i dati di questo dispositivo')}}
  catch(x){clFail(x)}clBusy=false;clUpd();draw();res()};
 clModal('<h3 style="margin-top:0">I dati sul cloud e su questo dispositivo sono diversi</h3><p>Sul cloud c\'è una versione salvata '+(R.updated_at?'il '+e(new Date(R.updated_at).toLocaleString('it-IT')):'')+(R.device?' da «'+e(R.device)+'»':'')+'. Anche questo dispositivo contiene dati non ancora sincronizzati. Quali vuoi tenere?</p><p class="mu">La versione scartata non va persa: se scegli il cloud, i dati di questo dispositivo restano in una copia di sicurezza; se scegli questo dispositivo, la versione del cloud resta tra le «Versioni precedenti».</p><p><button class="pr" onclick="clPickRes(\'cloud\')">Usa i dati del cloud</button></p><p><button onclick="clPickRes(\'local\')">Usa i dati di questo dispositivo</button></p><p><button onclick="clPickRes(\'later\')">Decido dopo</button></p>')})}

/* ---- versioni precedenti nel cloud ---- */
async function clHist(){try{await clTok();const r=await clReq('GET','/rest/v1/app_data_hist?app=eq.'+clApp+'&select=id,rev,device,saved_at&order=id.desc&limit=30');if(!r.ok)throw new Error(await clEm(r));const a=await r.json();
 clModal('<h3 style="margin-top:0">Versioni precedenti nel cloud</h3>'+(a.length?'<p class="mu">Ogni volta che i dati vengono aggiornati, la versione precedente viene conservata (le ultime 30).</p><table>'+a.map(v=>'<tr><td>'+e(new Date(v.saved_at).toLocaleString('it-IT'))+'<td class="mu">'+e(v.device||'')+'<td><button onclick="clRestore('+v.id+')">Ripristina</button>').join('')+'</table>':'<p>Nessuna versione precedente.</p>')+'<p><button onclick="clModalX()">Chiudi</button></p>')}
 catch(x){alert('Impossibile leggere le versioni: '+(x.message||x))}}
async function clRestore(id){try{const r=await clReq('GET','/rest/v1/app_data_hist?id=eq.'+id+'&select=payload,saved_at');if(!r.ok)throw new Error(await clEm(r));const a=await r.json();if(!a.length)return;
 if(!confirm('Ripristinare la versione del '+new Date(a[0].saved_at).toLocaleString('it-IT')+'? I dati attuali verranno sostituiti (restano comunque tra le versioni precedenti).'))return;
 const d=await clDec(a[0].payload);clBak();S=norm(d);save();clModalX();draw();toast('Versione ripristinata')}catch(x){alert('Impossibile ripristinare: '+(x.message==='PASS'?'passphrase diversa':x.message||x))}}

/* ---- schermata Impostazioni ---- */
function clBadgeIn(){if(!clOn())return'<span class="mu">☁ cloud non attivo</span>';
 if(clErr)return'<span class="ko">⚠ cloud: '+e(clErr)+'</span>';
 if(clAsking)return'<span class="ko">☁ scegli quali dati tenere</span>';
 if(clBusy)return'<span class="mu">☁ sincronizzo…</span>';
 if(clSt.dirty)return'<span class="ko">☁ da sincronizzare'+(clOff?' (senza rete)':'')+'</span>';
 return'<span class="ok">☁ sincronizzato'+(clSt.last?' alle '+e(clSt.last):'')+'</span>'}
const clBadge=()=>(clUrl()&&clKey0())?' <span id="clb">'+clBadgeIn()+'</span>':'';
const clUpd=()=>{const b=document.getElementById('clb');if(b)b.innerHTML=clBadgeIn();const s=document.getElementById('clb2');if(s)s.innerHTML=clBadgeIn()};
function clBlock(){const cfg=clUrl()&&clKey0();let h='<div class="c"><b>Cloud cifrato (Supabase)</b> <span id="clb2">'+(clUrl()?clBadgeIn():'')+'</span>';
 if(clOn()){h+='<p>Collegato come <b>'+e(clSt.email)+'</b>. A ogni modifica i dati vengono salvati su questo dispositivo e, cifrati con la tua passphrase, sul cloud. Sugli altri dispositivi basta collegarsi con lo stesso account e la stessa passphrase.</p><p><button class="pr" onclick="clSync(true)">Sincronizza ora</button> <button onclick="clHist()">Versioni precedenti nel cloud</button> '+(clBakHas()?'<button onclick="clRestoreBak()">Ripristina la copia di sicurezza di questo dispositivo</button> ':'')+'<button onclick="clOut()">Scollega questo dispositivo</button></p>'}
 else{h+='<p class="mu">Salva i dati sul cloud, cifrati con una passphrase che conosci solo tu, e li ritrovi su Mac, Windows e Android. <b>Se perdi la passphrase i dati sul cloud non sono recuperabili:</b> continua a fare anche il backup .json.</p>';
  if(!cfg)h+='<div class="g"><label>Indirizzo del progetto Supabase<input id="cl_url" value="'+e(clUrl())+'" placeholder="https://xxxx.supabase.co"></label><label>Chiave pubblica (anon / publishable)<input id="cl_key" value="'+e(clKey0())+'"></label></div>';
  h+='<div class="g"><label>Email dell\'account<input id="cl_em" type="email" value="'+e(clSt.email)+'" autocomplete="username"></label><label>Password dell\'account<input id="cl_pw" type="password" autocomplete="current-password"></label><label>Passphrase di cifratura (almeno 8 caratteri)<input id="cl_pp" type="password" autocomplete="off"></label><label>Ripeti la passphrase (solo la prima volta in assoluto)<input id="cl_pp2" type="password" autocomplete="off"></label></div><p><button class="pr" onclick="clLogin()">Accedi e attiva la sincronizzazione</button></p>'}
 return h+'</div>'}
async function clLogin(){const g=id=>{const x=document.getElementById(id);return x?x.value.trim():''};
 const url=g('cl_url'),key=g('cl_key'),em=g('cl_em'),pw=document.getElementById('cl_pw')?document.getElementById('cl_pw').value:'',pp=g('cl_pp'),pp2=g('cl_pp2');
 if(url)clSt.url=url;if(key)clSt.key=key;
 if(!clUrl()||!clKey0())return alert('Inserisci indirizzo e chiave pubblica del progetto Supabase');
 if(!em||!pw)return alert('Inserisci email e password dell\'account');if(pp.length<8)return alert('La passphrase deve avere almeno 8 caratteri');
 clBusy=true;clUpd();
 try{const r=await fetch(clUrl()+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:clKey0(),'Content-Type':'application/json'},body:JSON.stringify({email:em,password:pw})});
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(/invalid/i.test(j.error_description||j.msg||'')?'Email o password non corrette':(j.error_description||j.msg||j.message||('Errore '+r.status)));
  clSess(j);clSt.email=em;clSt.pass=pp;clSalt=null;clSt.rev=0;clSt.dirty=false;clSave();
  const R=await clGet();
  if(R){try{await clDec(R.payload)}catch(x){clSt.rt='';clSt.pass='';clSave();throw new Error('Passphrase non corretta: deve essere quella scelta sul primo dispositivo')}}
  else if(pp!==pp2){clSt.rt='';clSt.pass='';clSave();throw new Error('Prima configurazione: scrivi la stessa passphrase nei due campi')}
  clBusy=false;draw();await clSync(true);draw()}
 catch(x){clBusy=false;clUpd();alert(x.message||x);draw()}}
function clOut(){if(!confirm('Scollegare questo dispositivo dal cloud? I dati restano qui e nel cloud; smette solo la sincronizzazione.'))return;clSt.at='';clSt.rt='';clSt.pass='';clSt.exp=0;clSave();draw()}

/* ---- avvio e aggiornamenti periodici ---- */
document.addEventListener('input',ev=>{if(ev.target&&ev.target.closest&&ev.target.closest('#app'))clTyped=true},true);
document.addEventListener('visibilitychange',()=>{if(!document.hidden)clSync()});window.addEventListener('online',()=>clSync());
window.addEventListener('load',()=>{setTimeout(()=>clSync(),400);setInterval(()=>{if(!document.hidden)clSync()},60000)});

/* ---- salvataggio file e stampa nelle app native ---- */
async function nativeSave(n,t,ty){try{const P=window.Capacitor.Plugins,w=await P.Filesystem.writeFile({path:n,data:t,directory:'CACHE',encoding:'utf8'});await P.Share.share({title:n,url:w.uri,dialogTitle:'Salva o invia '+n})}catch(x){if(!/cancel/i.test(String(x&&x.message||x)))alert('Impossibile salvare il file: '+(x&&x.message||x))}}
if(window.NATIVE==='android'){const p0=window.print.bind(window);window.print=()=>{const P=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.PrintPlugin;if(P)P.print().catch(x=>alert('Stampa non riuscita: '+(x&&x.message||x)));else p0()}}
if(!window.NATIVE&&'serviceWorker' in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script>
const $=s=>document.querySelector(s),r2=x=>Math.round(x*100+1e-6)/100,eu=x=>Math.round(x+1e-9);
const f2=x=>(+x||0).toLocaleString('it-IT',{minimumFractionDigits:2,maximumFractionDigits:2});
const e=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&apos;'}[c]));
const up=()=>{try{window.scrollTo(0,0)}catch(x){}document.documentElement.scrollTop=0;document.body.scrollTop=0};let _n=0;const uid=()=>Date.now().toString(36)+(++_n).toString(36)+Math.random().toString(36).slice(2,5);
const dd=d=>d.split('-').reverse().join('/');
let S={azi:{codContratto:'G325',regola:'primo'},mus:[],gg:[],ev:[]},tab='mese',ym=new Date().toISOString().slice(0,7),warn='',ed=null;
window.__CLS0=JSON.stringify(S);try{const t=localStorage.getItem('cs1');if(t)S=Object.assign(S,JSON.parse(t))}catch(x){warn='Salvataggio non disponibile in questa finestra: apri il file dal tuo computer con Safari o Chrome.'}
let FH=null,fsOn=false,fsMsg='',tmr=null;
const APPV='2026-10-19.1';

function calcW(m,ds,mm,cum){
 const P=par(+mm.slice(0,4)),sy=m.reg==='SY';let I=0,E=0,B=0,cr=0,R=0,Dr=0,Ex=0;
 ds.forEach(d=>{const r=+d.cachet||0;R+=r;Dr+=+d.diritti||0;Ex+=+d.esenti||0;let imp=r,ec=0;
  if(sy&&r>P.M){let mx;if(P.fasce){let j=P.fasce.u.findIndex(x=>r<=x);if(j<0)j=7;mx=P.fasce.c[j]}else{const j=LIM.findIndex(l=>r<=l*P.M);mx=(j<0?8:j)*P.M}imp=Math.min(r,mx);ec=r-imp}
  I+=imp;E+=ec;if(sy)B+=Math.max(0,imp-P.so)});
 if(!sy){const cap=P.cap,ov=Math.max(0,cum+I-cap)-Math.max(0,cum-cap);E=ov;I-=ov;B=Math.max(0,I-P.mens)}
 cr=Math.max(0,I-P.mal*new Set(ds.map(d=>d.data)).size)*P.rMal/100;
 I=eu(I);E=eu(E);B=eu(B);
 const con=r2(I*(P.rTot+P.rMal)/100),c1=r2(B*P.r1/100),so=r2(E*P.rSol/100),crd=r2(cr),rI=r2(I*P.rLav/100),sL=r2(E*P.rSolL/100),lav=r2(rI+c1+sL),gross=r2(con+c1+so);
 return{I,E,B,R,Dr,Ex,con,c1,so,crd,rI,sL,lav,gross,net:eu(gross)-eu(crd),n:ds.length}}

  const ds=by[id].sort((a,b)=>a.data<b.data?-1:1),y=ym.slice(0,4);
  const cum=AG.filter(g=>g.mus==id&&g.data.slice(0,4)==y&&g.data<ym+'-01').reduce((s,g)=>s+(+g.cachet||0),0);

const lev=(a,b,m)=>{if(Math.abs(a.length-b.length)>m)return m+1;let p=Array.from({length:b.length+1},(_,j)=>j);for(let i=1;i<=a.length;i++){const c=[i];let lo=i;for(let j=1;j<=b.length;j++){const v=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]==b[j-1]?0:1));c.push(v);if(v<lo)lo=v}if(lo>m)return m+1;p=c}return p[b.length]};
const CC={};
function citCode(v){const n=nk(v);if(!n)return null;if(n in CC)return CC[n];let r=null;

 return CC[n]=r}

function readTxt(f,cb){const fr=new FileReader();fr.onload=()=>{const b=fr.result;let t;try{t=new TextDecoder('utf-8',{fatal:true}).decode(b)}catch(x){const u=new Uint8Array(b),C=[new TextDecoder('windows-1252').decode(b)];try{C.push(new TextDecoder('macintosh').decode(b))}catch(y){}C.push(Array.from(u,c=>c<128?String.fromCharCode(c):CP850[c-128]).join(''));t=C.reduce((a,c)=>hdrScore(c)>hdrScore(a)?c:a,C[0])}cb(t)};fr.readAsArrayBuffer(f)}
function impCSV(i){const f=i.files[0];if(!f)return;readTxt(f,txt=>{const R=parseCSV(txt);if(R.length<2)return alert('File vuoto o senza intestazioni');
 const M={},NR=[];R[0].forEach((h,j)=>{const n=nk(h);let k=IMAPN[n];if(!k&&/^citt/.test(n)&&!/^cittadin/.test(n))k='citta';if(!k&&/^nazionalit/.test(n))k='naz';if(k&&M[k]==null)M[k]=j;else if(!k&&n)NR.push(h.trim())});
 if(M.cognome==null||M.cf==null)return alert('Servono almeno le colonne Cognome e Codice Fiscale');
 const by={},W={reg:0,iva:0,citt:0,ap:0,cf:0,pv:0,pm:0,cl:{}};let skip=0,dup=0;
 R.slice(1).forEach(row=>{const o={};Object.keys(M).forEach(k=>o[k]=(row[M[k]]||'').trim());o.cf=(o.cf||'').toUpperCase().replace(/\s/g,'');if(!o.cognome||!o.cf){skip++;return}
  if(o.cf.length!=16)W.cf++;
  if('reg' in o){const m={C3:'SC',Y3:'SY',SC:'SC',SY:'SY'}[o.reg.toUpperCase()];if(!m)W.reg++;o.reg=m||''}
  if('iva' in o){o.iva=o.iva.toUpperCase();if(!['NO','SI','SICM'].includes(o.iva)){W.iva++;o.iva=''}}
  if('piva' in o){o.piva=o.piva.toUpperCase().replace(/^IT/,'').replace(/[\s.\-]/g,'');if(o.piva&&!/^\d{11}$/.test(o.piva))W.pv++}
  if(('iva' in o||'piva' in o)&&(o.iva==='SI'||o.iva==='SICM')&&!o.piva)W.pm++;
  if('sesso' in o)o.sesso=o.sesso.slice(0,1).toUpperCase();
  if('qual' in o&&/^\d+$/.test(o.qual))o.qual=o.qual.padStart(3,'0');
  if('citt' in o||'naz' in o){const raw=(o.citt||o.naz||'').trim();delete o.naz;o.citt='';if(raw){const c=citCode(raw);if(c){o.citt=c.c;if(c.a)W.ap++}else{W.citt++;const u=raw.toUpperCase();W.cl[u]=(W.cl[u]||0)+1}}}
  if(by[o.cf])dup++;by[o.cf]=o});

 IMP={L,nuovi:L.filter(o=>!ex.has(o.cf)).length,agg:L.filter(o=>ex.has(o.cf)).length,skip,dup,W,noIva:M.iva==null,NR};draw()})}

 return D.map(o=>{const m=o.m,C=o.C,Dr=o.D,X=o.X,ra=raOf(m,C,Dr,X),i10=m.iva==='SI'?r2((C+X)*.1):0,i22=m.iva==='SI'?r2(Dr*.22):0,tt=r2(C+i10+Dr+i22+X-o.rI-o.c1-o.sL-ra),bollo=(m.iva!=='SI'&&C+Dr+X>77.47)?2:0;
  const L=[['Compenso artistico',C],['Cessione diritti di replica e registrazione (art. 43 c. 3 L. 289/2002)',Dr]];
  if(X)L.splice(2,0,['Cachet esenti (irrilevanti ai fini contributivi)',X]);if(i10)L.push([X?'IVA 10% sul compenso e sui cachet esenti':'IVA 10% sul compenso',i10]);if(i22)L.push(['IVA 22% sulla cessione diritti',i22]);
  L.push(['Ritenuta INPS ex-Enpals 9,19%',-o.rI],['Contributo aggiuntivo 1% (rivalsa)',-o.c1],['Contributo di solidarietà 3%',-o.sL]);if(ra)L.push(["Ritenuta d'acconto 20%",-ra]);
  const no=m.iva==='NO',ev=Object.keys(o.evs).map(id=>S.ev.find(v=>v.id==id)).filter(Boolean).sort((a,b)=>k0(a)<k0(b)?-1:1),nd=ev.reduce((a,v)=>a+o.evs[v.id].size,0);
  return`<div class="pg"><h3>${no?'Nota di onorario':'Dati per la fattura elettronica del musicista'}</h3><p class="mu">Data: ${dd(DOCD)}</p>${party(no?'Prestatore':'Cedente',m)}${party(no?'Committente':'Cessionario',A)}<p>Prestazioni rese ${ev.length>1?'nei seguenti eventi':'nell\'evento'}:</p><ul>${ev.map(v=>`<li>${e(v.nome)}${v.comune?' ('+e(cname(v.comune)||v.comune)+')':''}, giornate: ${[...o.evs[v.id]].sort().map(dd).join(', ')}</li>`).join('')}</ul><p class="mu">Giornate complessive: ${nd}.</p>
<table>${L.map(([l,v])=>`<tr><td>${l}<td class="n">${f2(v)} euro`).join('')}<tr><td><b>${no?'Totale da pagare':'Totale fattura'}</b><td class="n"><b>${f2(tt)} euro</b>${bollo?`<tr><td>${no?'Applicare marca da bollo':'Imposta di bollo'}<td class="n">2,00 euro`:''}</table>
${no?'<p class="mu">Prestazioni rese ai sensi e per gli effetti dell\'art. 5 del D.P.R. 633/72 e art. 49 della legge 917/86.</p>':''}</div>`}).join('')}

/* costi per evento: contributi a carico azienda = totale contributi - quota lavoratore - credito malattia, ripartiti in proporzione al cachet del mese */
function costEv(v){const L={},mm=[...new Set(allGg().filter(g=>g.ev==v.id).map(g=>g.data.slice(0,7)))];
 mm.forEach(ym=>month(ym).forEach(r=>{const mine=r.ds.filter(g=>g.ev==v.id);if(!mine.length)return;
  const W=r.ds.reduce((a,g)=>a+g.cachet,0),w=mine.reduce((a,g)=>a+g.cachet,0),sh=W?w/W:0,c=r.c,di=mine.reduce((a,g)=>a+(+g.diritti||0),0),es=mine.reduce((a,g)=>a+(+g.esenti||0),0);
  const o=L[r.m.id]=L[r.m.id]||{m:r.m,gg:0,ca:0,di:0,es:0,co:0,iva:0,ra:0};
  o.gg+=new Set(mine.map(g=>g.data)).size;o.ca+=w;o.di+=di;o.es+=es;o.co+=(c.gross-c.lav-c.crd)*sh;o.iva+=r.m.iva==='SI'?(w+es)*.1+di*.22:0;o.ra+=r.m.iva==='SICM'?0:(w+di+(raEx()?es:0))*.2}));
 v.pr.forEach(p=>{const m=pm(p);if(!m)return;const di=pn(p.dir)||0,es=pn(p.ex)||0;if(!(di>0||es>0))return;if(L[m.id]&&L[m.id].fromDays)return;
  if(allGg().some(g=>g.ev==v.id&&g.mus==m.id))return;
  const q=L[m.id]=L[m.id]||{m,gg:0,ca:0,di:0,es:0,co:0,iva:0,ra:0};q.di+=di;q.es+=es;q.iva+=m.iva==='SI'?es*.1+di*.22:0;q.ra+=m.iva==='SICM'?0:(di+(raEx()?es:0))*.2});
 const R=Object.values(L).sort((a,b)=>(a.m.cognome+a.m.nome).localeCompare(b.m.cognome+b.m.nome,'it'));
 return{R,T:R.reduce((t,o)=>({ca:t.ca+o.ca,di:t.di+o.di,es:t.es+o.es,co:t.co+o.co,iva:t.iva+o.iva,ra:t.ra+o.ra}),{ca:0,di:0,es:0,co:0,iva:0,ra:0})}}
const cr=o=>`<td class="n">${f2(o.ca)}<td class="n">${f2(o.di)}<td class="n">${f2(o.es)}<td class="n">${f2(o.co)}<td class="n"><b>${f2(o.ca+o.di+o.es+o.co)}</b><td class="n">${f2(o.iva)}<td class="n">${f2(o.ca+o.di+o.es+o.co+o.iva)}<td class="n">${f2(o.ra)}`;
const CH='<th class="n">Cachet<th class="n">Diritti<th class="n">Cachet esenti<th class="n">Contributi azienda<th class="n">Costo senza IVA<th class="n">IVA<th class="n">Costo con IVA<th class="n">Ritenuta d\'acconto';
function vCos(){const L=(S.ev||[]).slice().sort((a,b)=>k0(a)<k0(b)?1:-1);if(!L.length)return'<p class="mu">Nessun evento inserito.</p>';
 return`<div class="w"><table><tr><th>Evento<th>Data${CH}<th></tr>${L.map(v=>`<tr><td>${e(v.nome)}<td>${dd(k0(v))}${cr(costEv(v).T)}<td><button onclick="dCos('${v.id}')">Dettaglio</button></tr>`).join('')}</table></div>
<p class="mu">I contributi a carico azienda sono al netto del credito malattia. Se un musicista lavora in più eventi nello stesso mese, vengono ripartiti in proporzione al cachet. La ritenuta d'acconto (20% su cachet e diritti, per chi non è forfettario) è indicata a parte: viene trattenuta al musicista e non rientra nei costi.</p>`}

const crC=o=>`<td class="n">${f2(o.ca)}<td class="n">${f2(o.di)}<td class="n">${f2(o.es)}<td class="n">${f2(o.co)}<td class="n"><b>${f2(o.ca+o.di+o.es+o.co)}</b><td class="n">${f2(o.iva)}<td class="n">${f2(o.ra)}`;
const CHC='<th class="n">Cachet<th class="n">Diritti<th class="n">Cachet esenti<th class="n">Contributi azienda<th class="n">Costo senza IVA<th class="n">IVA<th class="n">Ritenuta d\'acconto';

<div class="w"><table><tr><th>Musicista<th>Codice fiscale<th>Documento identità${CHC}</tr>${R.map(o=>`<tr><td>${e(o.m.cognome+' '+o.m.nome)}<td>${e(o.m.cf||'')}<td>${e(o.m.doc||'')}${crC(o)}</tr>`).join('')}<tr><th colspan="3">Totale evento${crC(T).replace(/<td/g,'<th').replace(/<b>|<\/b>/g,'')}</tr></table></div>
<p class="mu">Contributi a carico azienda: quota del datore di lavoro al netto del credito malattia. La ritenuta d'acconto e i contributi a carico del musicista sono trattenuti dal compenso e non sono un costo aggiuntivo.</p></div>`)}

/* XML UniEmens: bozza costruita sul documento tecnico INPS e sui flussi accettati; va controllata con il validatore INPS */
function xml(rows){const A=S.azi,t=tot(rows),n2=x=>r2(x).toFixed(2).replace('.',','),ni=x=>String(eu(x)),U=x=>e(String(x||'').toUpperCase()),k=(n,v)=>`<${n}>${v}</${n}>`,q=x=>String(x||'').padStart(3,'0');
 const w=rows.map(r=>{const m=r.m,c=r.c,sy=m.reg==='SY';
  const ro=r.days.map(d=>`<RetribuzioneOrdinaria>${k('NumGiorniLavorati','1')}<Periodo>${k('DataInizio',d)}${k('DataFine',d)}</Periodo>${k('ImpRetrOrdinaria',ni(r.ds.filter(g=>g.data==d).reduce((a,g)=>a+g.cachet,0)))}</RetribuzioneOrdinaria>`).join('');
  const gi=r.days.map(d=>`<Giorno GG="${d.slice(8)}">${k('Lavorato',r.ds.some(g=>g.data==d&&g.lav!==false)?'S':'N')}${k('TipoCoperturaGiorn','X')}</Giorno>`).join('');
  return`<DenunciaIndividuale>${k('CFLavoratore',U(m.cf))}${k('Cognome',U(m.cognome))}${k('Nome',U(m.nome))}${k('Qualifica1','S')}${k('Qualifica2','F')}${k('Qualifica3','D')}${k('TipoContribuzione','00')}${k('RegimePost95',sy?'N':'S')}${k('Cittadinanza',e(m.citt||'000'))}${k('UnitaOperativa','0')}${k('UnitaProduttiva','0')}${k('CodiceComune',U(r.com))}${k('CodiceContratto',U(A.codContratto||'G325'))}${k('TipoCodiceContratto','02')}${k('TipoPaga','G')}${k('NumMensilita','13000')}`
  +`<DatiRetributivi>${k('TipoLavoratore',m.reg)}${k('Imponibile',ni(c.I))}${k('Contributo',n2(c.con))}`
  +(c.B>0?`<ContribuzioneAggiuntiva><Contrib1PerCento>${k('ImponibileCtrAgg',ni(c.B))}${k('ContribAggCorrente',n2(c.c1))}</Contrib1PerCento></ContribuzioneAggiuntiva>`:'')
  +(c.crd>0?`<Malattia><MalACredito><MalACredAltre>${k('CausaleRecMal','R808')}${k('ImportoRecMal',n2(c.crd))}</MalACredAltre></MalACredito></Malattia>`:'')
  +`${k('RetribTeorica',ni(c.R))}${gi}${k('GiorniRetribuiti',r.days.length)}${k('GiorniContribuiti',r.days.length)}${k('RispettoMinimale','S')}<DatiParticolari>`
  +(c.E>0?`<EccMassSportSpet><EccMassSpet>${k('ImpEccMassSpet',ni(c.E))}${k('ContrEccMassSpet','0,00')}${k('ContrSolidarietaSpet',n2(c.so))}</EccMassSpet></EccMassSportSpet>`:'')
  +`<TipoLavSportSpet>${k('TipoRapportoLav','LA')}${k('CodiceQualifica',q(m.qual))}</TipoLavSportSpet>`
  +(sy?`<FondiSpeciali><SportSpet><DatiMeseSportSpet>${ro}</DatiMeseSportSpet></SportSpet></FondiSpeciali>`:'')+`</DatiParticolari></DatiRetributivi></DenunciaIndividuale>`}).join('\n');
 return`<?xml version="1.0" encoding="UTF-8"?>\n<DenunceMensili${A.ns?` xmlns="${e(A.ns)}"`:''}><DatiMittente Tipo="1">${k('CFPersonaMittente',U(A.mitCF))}${k('RagSocMittente',U(A.mitRag))}${k('CFMittente',U(A.cf))}${k('CFSoftwarehouse',U(A.cf))}${A.sede?k('SedeINPS',e(A.sede)):''}</DatiMittente><Azienda>${k('AnnoMeseDenuncia',ym)}${k('CFAzienda',U(A.cf))}${k('RagSocAzienda',U(A.rag))}<PosContributiva Composizione="CP">${k('Matricola',e(A.matricola))}\n${w}\n<DenunciaAziendale>${k('TrattQuotaLav','S')}${k('NumLavoratori',rows.length)}${k('ForzaAziendale',rows.length)}<DatiQuadraturaRetrContr>${k('NumDenIndiv',rows.length)}${k('TotaleADebito',t.deb)}${k('TotaleACredito',t.cred)}</DatiQuadraturaRetrContr></DenunciaAziendale></PosContributiva></Azienda></DenunceMensili>`}

 return`<div class="c"><b>Controllo dei calcoli sui tuoi documenti di prova</b><p class="mu">Ogni riga confronta il risultato dell'app con le cifre dei tuoi riepiloghi.</p><table>${T.map(([n,ok,x])=>`<tr><td>${n}<td class="${ok?'ok':'ko'}">${ok?'corretto':'DIVERSO'}<td class="mu">${x}`).join('')}</table></div>`}
/* salvataggio automatico su file (browser Chromium: Opera, Chrome, Edge). Se il browser non lo supporta resta l'esportazione manuale */
const FSOK=typeof window!=='undefined'&&'showSaveFilePicker' in window&&!window.NATIVE,FT=[{description:'Dati compensi',accept:{'application/json':['.json']}}],norm=d=>Object.assign({azi:{},mus:[],gg:[],ev:[]},d);
const idb=(m,v)=>new Promise((ok,ko)=>{const q=indexedDB.open('cs1db',1);q.onupgradeneeded=()=>q.result.createObjectStore('k');q.onerror=()=>ko(q.error);q.onsuccess=()=>{const o=q.result.transaction('k',m==='get'?'readonly':'readwrite').objectStore('k'),r=m==='get'?o.get('fh'):m==='del'?o.delete('fh'):o.put(v,'fh');r.onsuccess=()=>ok(r.result);r.onerror=()=>ko(r.error)}});
async function fsOff(){if(!confirm('Disattivare il salvataggio automatico su file? Il file resta dov\'è, con i dati fino a questo momento, ma non viene più aggiornato. I dati restano nel browser e puoi fare il backup manuale.'))return;clearTimeout(tmr);FH=null;fsOn=false;fsMsg='';try{await idb('del')}catch(x){}draw();toast('Salvataggio automatico su file disattivato')}
async function fsWrite(){if(!FH)return;try{const w=await FH.createWritable();await w.write(JSON.stringify(S));await w.close();fsMsg='Ultimo salvataggio alle '+new Date().toLocaleTimeString('it-IT')}catch(x){fsMsg='Salvataggio su file non riuscito ('+x.message+')'}const m=$('#fsmsg');if(m)m.textContent=fsMsg}
async function fsNew(){try{const h=await showSaveFilePicker({suggestedName:fnm(S.azi.fsNome,DFS)+'.json',types:FT});FH=h;fsOn=true;await idb('put',h).catch(()=>{});await fsWrite();draw()}catch(x){if(x.name!=='AbortError')alert('Impossibile creare il file: '+x.message)}}
async function fsOpen(){try{const[h]=await showOpenFilePicker({types:FT});const d=JSON.parse(await(await h.getFile()).text());if(!confirm('Caricare i dati dal file? Sostituiscono quelli presenti ora in questo browser.'))return;S=norm(d);FH=h;await idb('put',h).catch(()=>{});fsOn=(await h.queryPermission({mode:'readwrite'}))==='granted';fsMsg='Dati caricati dal file';save();draw()}catch(x){if(x.name!=='AbortError')alert('Impossibile aprire il file: '+x.message)}}
async function fsBack(m){try{if(await FH.requestPermission({mode:'readwrite'})!=='granted')return;if(m==='load'){S=norm(JSON.parse(await(await FH.getFile()).text()));fsMsg='Dati caricati dal file'}fsOn=true;save();if(m==='write')await fsWrite();draw()}catch(x){alert('Impossibile riconnettere il file: '+x.message)}}
const fsBlock=()=>window.NATIVE?`<p class="mu">In questa app i dati sono salvati sul dispositivo e, se attivi il cloud qui sopra, anche online. Per una copia a parte usa «Esporta backup».</p>`:!FSOK?`<p class="mu">In questo browser il salvataggio automatico su file non è disponibile: usa Opera o Chrome su computer. Resta l'esportazione del backup qui sotto.</p>`
:FH&&fsOn?`<p class="ok">Salvataggio automatico attivo sul file «${e(FH.name)}». <span id="fsmsg">${e(fsMsg)}</span></p><button onclick="fsNew()">Cambia file</button> <button onclick="fsOpen()">Apri un altro file di dati</button> <button onclick="fsOff()">Disattiva il salvataggio automatico</button>`
:FH?(fsMsg?`<p>Dati caricati dal file «${e(FH.name)}». Per scriverci in automatico il browser chiede un consenso separato: premi il pulsante.</p><button class="pr" onclick="fsBack('keep')">Consenti il salvataggio automatico su questo file</button> <button onclick="fsOff()">Disattiva</button>`:`<p>File collegato: «${e(FH.name)}». Per riattivare il salvataggio serve il tuo consenso.</p><button class="pr" onclick="fsBack('load')">Riconnetti e carica i dati dal file</button> <button onclick="fsBack('write')">Riconnetti e sovrascrivi il file con i dati di questo browser</button> <button onclick="fsOff()">Disattiva</button>`)
:`<p><button class="pr" onclick="fsNew()">Crea il file di salvataggio automatico</button> <button onclick="fsOpen()">Apri un file di dati esistente</button></p><p class="mu">Per avere anche la copia nel cloud scegli una cartella sincronizzata (iCloud Drive, Dropbox, OneDrive). Il file contiene codici fiscali e IBAN in chiaro: tienilo in una cartella protetta.</p>`;
(async()=>{if(!FSOK)return;try{const h=await idb('get');if(!h)return;FH=h;if(await h.queryPermission({mode:'readwrite'})==='granted'){S=norm(JSON.parse(await(await h.getFile()).text()));fsOn=true;fsMsg='Dati caricati dal file'}}catch(x){}draw()})();
