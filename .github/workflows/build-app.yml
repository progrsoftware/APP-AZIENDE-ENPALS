name: Costruisci le app

# Si avvia a mano: scheda "Actions" > "Costruisci le app" > "Run workflow".
on:
  workflow_dispatch:

jobs:
  computer:
    name: ${{ matrix.variant }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
        variant: [martinelli, autonomi]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
        working-directory: native/desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Installa gli strumenti
        run: npm install --no-audit --no-fund
      - name: Prepara l'app
        run: node prepare.js ${{ matrix.variant }}
      - name: Costruisci l'installer
        env:
          VARIANT: ${{ matrix.variant }}
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npx electron-builder --config builder.config.js --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-${{ runner.os }}
          path: |
            native/desktop/dist/${{ matrix.variant }}/*.exe
            native/desktop/dist/${{ matrix.variant }}/*.dmg
          if-no-files-found: error

  android:
    name: ${{ matrix.variant }} (Android)
    strategy:
      fail-fast: false
      matrix:
        variant: [martinelli, autonomi]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: native/android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Installa gli strumenti
        run: npm install --no-audit --no-fund
      - name: Prepara l'app
        run: node prepare.js ${{ matrix.variant }}
      - name: Crea il progetto Android
        run: |
          npx cap add android
          node patch-android.js ${{ matrix.variant }}
          npx cap sync android
      - name: Chiave di firma (sempre la stessa, per poter aggiornare l'app senza disinstallarla)
        run: |
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore
      - name: Costruisci l'APK
        working-directory: native/android/android
        run: ./gradlew assembleDebug --no-daemon
      - name: Rinomina
        run: cp android/app/build/outputs/apk/debug/app-debug.apk ${{ matrix.variant }}-android.apk
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.variant }}-Android
          path: native/android/${{ matrix.variant }}-android.apk
          if-no-files-found: error

  pubblica:
    name: Pubblica gli installer
    needs: [computer, android]
    if: ${{ !cancelled() && (needs.computer.result == 'success' || needs.android.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - name: Crea la pagina dei download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la out
          gh release create "app-${{ github.run_number }}" out/* \
            --repo "${{ github.repository }}" \
            --title "App versione ${{ github.run_number }}" \
            --notes "Installer per Windows (.exe), Mac (.dmg) e Android (.apk)."
